<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Name Animation - Buat Kamu</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Canvas untuk efek hujan angka hacker di background */
        #matrix-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Container untuk teks di tengah layar */
        .name-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 15px; /* Jarak antar baris */
            align-items: center;
            z-index: 2; /* Supaya berada di atas canvas hujan Matrix */
            text-align: center;
            width: 100%;
        }

        .line {
            display: flex;
            gap: 15px; /* Jarak antar kata */
            justify-content: center;
        }

        .word {
            display: flex;
            gap: 4px; /* Jarak antar huruf/simbol */
        }

        /* Styling dasar teks */
        .letter {
            display: inline-block;
            color: #00ff66; /* Warna hijau neon khas Matrix */
            font-size: 2rem; /* Ukuran standar untuk baris 2 & 3 */
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.8), 0 0 20px rgba(0, 255, 102, 0.4);
            opacity: 0; /* Mulai dari tak terlihat */
            transform: translateY(20px);
            animation: fadeInLetter 0.5s ease forwards;
            
            /* Jeda 3 detik hujan Matrix dulu, baru huruf muncul satu per satu */
            animation-delay: calc(3s + (var(--i) * 0.08s)); 
        }

        /* Kelas khusus untuk memperbesar baris pertama ("AKU SAYANG KAMU") */
        .letter.large {
            font-size: 2.8rem; 
        }

        /* Kelas khusus untuk memberikan efek cahaya neon pada simbol emoji */
        .letter.symbol {
            filter: drop-shadow(0 0 8px rgba(0, 255, 102, 0.9));
        }

        /* Keyframes untuk animasi munculnya huruf */
        @keyframes fadeInLetter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Penyesuaian untuk layar HP agar teks tidak terlalu besar */
        @media (max-width: 600px) {
            .letter {
                font-size: 2rem;
            }
            .letter.large {
                font-size: 1.8rem;
            }
            .line {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="name-container">
        <!-- Baris 1: AKU SAYANG KAMU (Ukuran Lebih Besar / class "large", Urutan 1 - 13) -->
        <div class="line">
            <div class="word">
                <span class="letter large" style="--i: 1">A</span>
                <span class="letter large" style="--i: 2">K</span>
                <span class="letter large" style="--i: 3">U</span>
            </div>
            <div class="word">
                <span class="letter large" style="--i: 4">S</span>
                <span class="letter large" style="--i: 5">A</span>
                <span class="letter large" style="--i: 6">Y</span>
                <span class="letter large" style="--i: 7">A</span>
                <span class="letter large" style="--i: 8">N</span>
                <span class="letter large" style="--i: 9">G</span>
            </div>
            <div class="word">
                <span class="letter large" style="--i: 10">K</span>
                <span class="letter large" style="--i: 11">A</span>
                <span class="letter large" style="--i: 12">M</span>
                <span class="letter large" style="--i: 13">U</span>
            </div>
        </div>

        <!-- Baris 2: SUCI OKTAVIANA (Ukuran Standar, Urutan 14 - 26) -->
        <div class="line">
            <div class="word">
                <span class="letter" style="--i: 14">S</span>
                <span class="letter" style="--i: 15">U</span>
                <span class="letter" style="--i: 16">C</span>
                <span class="letter" style="--i: 17">I</span>
            </div>
            <div class="word">
                <span class="letter" style="--i: 18">O</span>
                <span class="letter" style="--i: 19">K</span>
                <span class="letter" style="--i: 20">T</span>
                <span class="letter" style="--i: 21">A</span>
                <span class="letter" style="--i: 22">V</span>
                <span class="letter" style="--i: 23">I</span>
                <span class="letter" style="--i: 24">A</span>
                <span class="letter" style="--i: 25">N</span>
                <span class="letter" style="--i: 26">I</span>
            </div>
        </div>

        <!-- Baris 3: Simbol 🫶🧸🫶 (Dengan efek neon symbol, Urutan 27 - 29) -->
        <div class="line">
            <div class="word">
                <span class="letter symbol" style="--i: 27">🫶</span>
                <span class="letter symbol" style="--i: 28">🧸</span>
                <span class="letter symbol" style="--i: 29">🫶</span>
            </div>
        </div>
    </div>
    

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const numbers = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 14;
        const columns = canvas.width / fontSize;

        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = numbers.charAt(Math.floor(Math.random() * numbers.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);
    </script>

</body>
</html>
