<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Name Animation - MAAFIN AKU YAH SUCI OKTAVIANA</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Canvas untuk efek hujan angka hacker */
        #matrix-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Container untuk teks di tengah & responsif */
        .name-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            flex-wrap: wrap; /* Agar otomatis turun ke bawah jika layar HP sempit */
            justify-content: center;
            gap: 15px;
            width: 95%;
            max-width: 800px;
            opacity: 0;
            animation: fadeInName 2s ease forwards;
            animation-delay: 3s;
        }

        .word {
            display: flex;
            gap: 2px;
        }

        .letter {
            /* Ukuran font otomatis menyesuaikan lebar layar HP */
            font-size: clamp(1.5rem, 6vw, 3.5rem);
            font-weight: bold;
            color: #00ff66;
            text-shadow: 0 0 8px #00ff66, 0 0 15px #00ff66;
            opacity: 0;
            transform: scale(0.3);
            animation: assembleLetter 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Jeda kemunculan huruf berurutan untuk setiap kata */
        /* Kata 1: MAAFIN (6 huruf) */
        .word:nth-child(1) .letter:nth-child(1) { animation-delay: 3.1s; }
        .word:nth-child(1) .letter:nth-child(2) { animation-delay: 3.3s; }
        .word:nth-child(1) .letter:nth-child(3) { animation-delay: 3.5s; }
        .word:nth-child(1) .letter:nth-child(4) { animation-delay: 3.7s; }
        .word:nth-child(1) .letter:nth-child(5) { animation-delay: 3.9s; }
        .word:nth-child(1) .letter:nth-child(6) { animation-delay: 4.1s; }

        /* Kata 2: AKU (3 huruf) */
        .word:nth-child(2) .letter:nth-child(1) { animation-delay: 4.4s; }
        .word:nth-child(2) .letter:nth-child(2) { animation-delay: 4.6s; }
        .word:nth-child(2) .letter:nth-child(3) { animation-delay: 4.8s; }

        /* Kata 3: YAH (3 huruf) */
        .word:nth-child(3) .letter:nth-child(1) { animation-delay: 5.1s; }
        .word:nth-child(3) .letter:nth-child(2) { animation-delay: 5.3s; }
        .word:nth-child(3) .letter:nth-child(3) { animation-delay: 5.5s; }

        /* Kata 4: SUCI (4 huruf) */
        .word:nth-child(4) .letter:nth-child(1) { animation-delay: 5.8s; }
        .word:nth-child(4) .letter:nth-child(2) { animation-delay: 6.0s; }
        .word:nth-child(4) .letter:nth-child(3) { animation-delay: 6.2s; }
        .word:nth-child(4) .letter:nth-child(4) { animation-delay: 6.4s; }

        /* Kata 5: OKTAVIANA (9 huruf) */
        .word:nth-child(5) .letter:nth-child(1) { animation-delay: 6.7s; }
        .word:nth-child(5) .letter:nth-child(2) { animation-delay: 6.9s; }
        .word:nth-child(5) .letter:nth-child(3) { animation-delay: 7.1s; }
        .word:nth-child(5) .letter:nth-child(4) { animation-delay: 7.3s; }
        .word:nth-child(5) .letter:nth-child(5) { animation-delay: 7.5s; }
        .word:nth-child(5) .letter:nth-child(6) { animation-delay: 7.7s; }
        .word:nth-child(5) .letter:nth-child(7) { animation-delay: 7.9s; }
        .word:nth-child(5) .letter:nth-child(8) { animation-delay: 8.1s; }
        .word:nth-child(5) .letter:nth-child(9) { animation-delay: 8.3s; }

        @keyframes fadeInName {
            to { opacity: 1; }
        }

        @keyframes assembleLetter {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(-30px);
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="name-container">
        <div class="word">
            <span class="letter">M</span>
            <span class="letter">A</span>
            <span class="letter">A</span>
            <span class="letter">F</span>
            <span class="letter">I</span>
            <span class="letter">N</span>
        </div>
        <div class="word">
            <span class="letter">A</span>
            <span class="letter">K</span>
            <span class="letter">U</span>
        </div>
        <div class="word">
            <span class="letter">Y</span>
            <span class="letter">A</span>
            <span class="letter">H</span>
        </div>
    </div>
        <div class="word">
            <span class="letter">S</span>
            <span class="letter">U</span>
            <span class="letter">C</span>
            <span class="letter">I</span>
        </div>
        <div class="word">
            <span class="letter">O</span>
            <span class="letter">K</span>
            <span class="letter">T</span>
            <span class="letter">A</span>
            <span class="letter">V</span>
            <span class="letter">I</span>
            <span class="letter">A</span>
            <span class="letter">N</span>
            <span class="letter">I</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const numbers = '0123456789';
        const fontSize = 14;
        const columns = canvas.width / fontSize;

        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = numbers.charAt(Math.floor(Math.random() * numbers.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);
    </script>

</body>
</html>
